name: Purge historical Actions runs

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-cleanup.yml'
  schedule:
    - cron: '31 * * * *'
  workflow_run:
    workflows: ['tweet-watcher']
    types: [completed]

permissions:
  actions: write
  contents: write

concurrency:
  group: security-history-purge
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Delete completed historical runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          WORKFLOW_PATH: .github/workflows/security-cleanup.yml
          SECURITY_CUTOFF: '2026-08-27T19:54:02Z'
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t run_ids < <(
            gh api --paginate               "repos/$REPOSITORY/actions/runs?status=completed&per_page=100"               --jq '.workflow_runs[].id'
          )

          deleted=0
          consecutive_failures=0

          for run_id in "${run_ids[@]}"; do
            if [[ "$run_id" == "$CURRENT_RUN_ID" ]]; then
              continue
            fi

            if gh api --silent -X DELETE "repos/$REPOSITORY/actions/runs/$run_id" 2>/dev/null; then
              deleted=$((deleted + 1))
              consecutive_failures=0
            else
              consecutive_failures=$((consecutive_failures + 1))
              echo "A run changed concurrently or the API limit was reached."
            fi

            if (( deleted >= 750 || consecutive_failures >= 3 )); then
              break
            fi
          done

          echo "Deleted $deleted completed historical run(s) in this batch."

          if ! remaining_ids="$(
            gh api --paginate               "repos/$REPOSITORY/actions/runs?status=completed&per_page=100"               --jq '.workflow_runs[].id' 2>/dev/null
          )"; then
            echo "Could not verify the remaining count. A later run will continue."
            exit 0
          fi

          remaining=0
          while IFS= read -r run_id; do
            if [[ -n "$run_id" && "$run_id" != "$CURRENT_RUN_ID" ]]; then
              remaining=$((remaining + 1))
            fi
          done <<< "$remaining_ids"

          echo "$remaining completed historical run(s) remain visible to the API."

          if (( remaining == 0 )); then
            mapfile -t stale_active_ids < <(
              gh api --paginate                 "repos/$REPOSITORY/actions/runs?per_page=100"                 --jq ".workflow_runs[] | select((.status == \"queued\" or .status == \"in_progress\") and .created_at < \"$SECURITY_CUTOFF\") | .id"
            )

            if (( ${#stale_active_ids[@]} > 0 )); then
              cancelled=0
              for run_id in "${stale_active_ids[@]}"; do
                if [[ "$run_id" == "$CURRENT_RUN_ID" ]]; then
                  continue
                fi
                if gh api --silent -X POST "repos/$REPOSITORY/actions/runs/$run_id/force-cancel" 2>/dev/null; then
                  cancelled=$((cancelled + 1))
                fi
                if (( cancelled >= 50 )); then
                  break
                fi
              done
              echo "Cancelled $cancelled stale pre-fix run(s). A later cleanup run will delete them."
              exit 0
            fi

            workflow_sha="$(
              gh api "repos/$REPOSITORY/contents/$WORKFLOW_PATH" --jq '.sha'
            )"

            gh api --silent -X DELETE "repos/$REPOSITORY/contents/$WORKFLOW_PATH"               -f message='security: remove completed cleanup workflow'               -f sha="$workflow_sha"

            echo "Cleanup finished. The temporary workflow removed itself."
          else
            echo "A later run will continue the cleanup."
          fi
