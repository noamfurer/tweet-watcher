name: tweet-watcher

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'src/scrape.mjs'
      - 'src/netlify-sync.mjs'
      - '.github/workflows/watch.yml'

permissions:
  contents: write
  id-token: write

concurrency:
  group: tweet-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEYWORDS: ${{ secrets.KEYWORDS }}
          STATE_SALT: ${{ secrets.STATE_SALT }}
        run: node src/scrape.mjs

      - name: Sync Netlify board
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node src/netlify-sync.mjs

      - name: Persist state
        run: |
          git config user.name "tweet-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen.json
          git add state/netlify-board-sync.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update watcher state [skip ci]"
            git pull --rebase --autostash || true
            git push || echo "push failed (state will be re-derived next run)"
          fi
